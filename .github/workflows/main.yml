name: 24/7 WhatsApp Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *' # පැය 5න් 5ට Auto Restart වී 24/7 Active තබයි

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Bot
        run: node index.js
